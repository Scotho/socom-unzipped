name: web
# The browser map viewer under web/, on its own: typecheck, the unit suite (the fixture-backed tests
# skip without game data) and a build. Runs only when web/ changes; the recomp's workflow is linux.yml.
on:
  push:
    paths: ['web/**']
  pull_request:
    paths: ['web/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
