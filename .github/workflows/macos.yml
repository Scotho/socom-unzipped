# The macOS (Apple Silicon) build, experimental (docs/MACOS.md; R350). Configure and build ps2_runtime, the launcher,
# vu1_replay and ps2x_tests on GitHub's arm64 macOS runner WITHOUT the generated game code (14,882 files produced from
# the owner's disc, never in the repository nor on a public runner), then run the suites: the Python suite,
# ps2x_tests and the VU1 replay goldens, through scripts/build_macos.sh -- the script Grswld's port brought.
#
# What green means: the library, the launcher and the tools compile and link natively for arm64 (sse2neon, AppleClang,
# FFmpeg from pinned source) and the suites pass there. It proves nothing about the game on a Mac -- that needs a Mac
# holding the owner's disc (docs/MACOS.md section 4). Not a required check on `main`: the port is experimental.
#
# Triggers and the `changes` gate are linux.yml's (see its header): a docs-only push starts no run; a pull request
# always runs and builds when anything outside docs/ changed. No synthetic-runner leg yet:
# scripts/build_synthetic_runner.sh has no Darwin branch (research/86 section 6).
name: macos

on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did anything outside docs/ change?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$EVENT: comparing $BASE...$HEAD (from their merge base)"
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$zero" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ($BASE): building"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git merge-base "$BASE" "$HEAD" >/dev/null 2>&1; then
            echo "no merge base for $BASE and $HEAD: building"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          changed=$(echo "$files" | grep -v -e '^docs/' -e '^$' || true)
          if [ -n "$changed" ]; then
            echo "code changed: $(wc -l <<<"$changed") files (the first 50 listed):"; head -n 50 <<<"$changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/ only: the build job is skipped"; echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # brew-unpinned (reviewed): Homebrew installs its current formula and has no version pin short of a tap; the
      # image's own Homebrew is what the run builds with, and the next step prints what it got. build_macos.sh needs
      # the arm64 cmake and ninja under /opt/homebrew; bash and coreutils are for the Python suite's harness scripts.
      - name: Install the toolchain (the arm64 Homebrew)
        run: |
          brew install cmake ninja pkgconf bash coreutils
          uname -m; /opt/homebrew/bin/cmake --version | head -1; /opt/homebrew/bin/ninja --version; clang --version | head -1

      # requirements.txt's pins in the venv build_macos.sh looks for (.venv/, git-ignored).
      - name: Install the Python packages the suite imports
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python --version

      - name: Build (no generated code)
        id: build
        run: bash scripts/build_macos.sh runtime --no-runner

      # Four wall-clock tests are skipped here (MiniTest's PS2X_TEST_SKIP: each prints [Skipped] and is counted apart,
      # never as a pass). On the first run (37885295297, 2026-10-09) they failed on this VM's timers while everything
      # deterministic passed: the R41 VBlank re-anchor pair ("20 wakes after the stall take about 333 ms, took 1699 ms"),
      # the PSS demux's two-packets-per-tick, and the parked recv's ticker count. They pass on the Windows and Linux
      # runners; whether a real Mac passes them is open (docs/MACOS.md section 4, KNOWN section 2, LATER 105).
      # The VM's timers also flake run to run: the second run (37886448208) failed a different one, accountCycles
      # ("about 20 ms of guest time, got 100"), which the first had passed; the third (37888073503) failed a Python
      # wall-clock simulation instead (test_aim_loop, "~30-60 s each"), green on both earlier runs. So when the goldens
      # passed and a suite failed, each failure runs ONCE more -- the failed Python tests by name, ps2x_tests whole --
      # and the second verdict stands, said in the log; a failure that is the Mac's and not the VM's fails both times.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PS2X_TEST_SKIP: "R41: a short wait after an unrelated executor stall,R41: after a long back-pressure wait,sceMpegDemuxPssRing lets audio flow past held video,a parked recv returns the datagram"
        run: |
          mkdir -p logs/ci
          log=logs/ci/build_macos_test.log
          rc=0
          bash scripts/build_macos.sh test --no-runner > "$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ] && grep -q '^tests: VU1    : ok' "$log"; then
            # build_macos.sh's test-step PATH: the venv, GNU coreutils, the arm64 Homebrew.
            export PATH="$PWD/.venv/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:$PATH"
            rc=0
            if grep -q '^tests: Python : FAILED' "$log"; then
              failed=$(grep -E '^(FAIL|ERROR): ' "$log" | sed -E 's/^[A-Z]+: [^ ]+ \(([^)]+)\).*/\1/' | sort -u)
              if [ -z "$failed" ]; then
                echo "the Python suite failed without a FAIL/ERROR line to rerun"; rc=1
              else
                echo "::warning::rerunning the failed Python tests once (the VM's wall-clock tests flake): $(echo $failed)"
                python -m unittest $failed > logs/ci/python_rerun.log 2>&1 || rc=1
                tail -5 logs/ci/python_rerun.log
              fi
            fi
            if grep -q '^tests: C++    : FAILED' "$log"; then
              echo "::warning::ps2x_tests failed once; rerunning it once (the VM's wall-clock tests flake)"
              grep -B1 -A3 'Failed\]' "$log" | sed 's/\x1b\[[0-9;]*m//g' || true
              (cd third_party/ps2recomp/build-macos/ps2xTest && ./ps2x_tests) > logs/ci/ps2x_tests_rerun.log 2>&1 || rc=1
              tail -5 logs/ci/ps2x_tests_rerun.log
            fi
            echo "after the reruns: exit $rc"
          fi
          exit "$rc"

      - name: Upload the launcher
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: socom-unzipped-launcher-macos-arm64
          path: dist-macos/socom_unzipped_launcher
          if-no-files-found: warn

      - name: Upload the test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-test-output
          path: logs/ci/*.log
          if-no-files-found: warn
