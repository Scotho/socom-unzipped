name: ci
# Typecheck and the unit suite. The fixture-backed tests (`it.skipIf`) skip here because no game data
# is in the repository; the Playwright e2e needs the extracted maps and is run on a developer machine.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
