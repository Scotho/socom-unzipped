# The status map's data: docs/status/map.svg and docs/status/detail.md are generated from this file.
# After an edit, regenerate:  python -m tools_py.status_map   (--check fails while either output is stale;
# tools_py/tests/test_status_map.py runs it on every suite).
#
# THE STATUS RULE (the coordinator's ruling for this map, 2026-10-12; repeated in detail.md):
#   "ok"      works in the game with no open defect or known divergence recorded in docs/KNOWN.md or docs/LATER.md.
#             Unverified against a console does NOT make a row partial on its own; the note says so where it applies.
#   "partial" an open defect or a known divergence, recorded in KNOWN or LATER (or, where both are silent, read
#             from the runtime's own code, which the note then names).
#   "pending" not modelled.
# Only "ok" counts in the percentages. KNOWN wins on any disagreement: when a KNOWN row moves, move the status here
# and say which row it rests on in the note. Rows are cited by their opening words and section (KNOWN "section 1" =
# proven, "section 2" = believed), LATER rows by number.
# The idea and the look: KIexster/god-of-war-recomp's "Current status" map (credited in README.md).

[meta]
title = "SOCOM Unzipped: status"
footnote = [
  "* One cell per function of the Sony and toolchain libraries statically linked into SCUS_972.75 (the loader, r0001), from the function map ps2_recomp compiles.",
  "Hardware: one rectangle per component, sized by weight. Statuses from docs/KNOWN.md and docs/LATER.md; every reason is in docs/status/detail.md.",
  "† Judgement scores from a 2026-10-11 audit, averaged per badge (eight categories for the recomp and the game, one for our server); two rows re-scored from KNOWN.",
]
intro = """
**The status rule.** *Working* (ok): works in the game with no open defect or known divergence recorded in
`docs/KNOWN.md` or `docs/LATER.md`; being unverified against a console does not make a row partial on its own, and
the note says so where it applies. *Partial*: an open defect or a known divergence. *Pending*: not modelled.

**What the libraries panel leaves out.** Only the loader `SCUS_972.75` is counted. The Sony code linked into the
game image itself is not: the libnet EE wrappers (0x245690-0x2484a0, research/10), the lgAud headset client, the
989snd `snd_*` client and the `sceInet*` calls, among others. The loader's own code (its `main()`, the "mp_net"
BSD-socket shim of research/10) is the game's, and zlib 1.1.4 is a third-party library; both are left out too.

**The hardware weights** are a rough share of the work each component asks of a PS2 recompilation and its runtime
(the CPU 5; the kernel, GS, VIF1/VU1 and SPU2 3; most others 2; the timers, USB and the HDD 1). They are
judgement calls, as in the map this one follows, and they decide only the size of a rectangle and the hardware
percentage.
"""
feature_intro = """
The badges marked † are computed here from the category scores of the 2026-10-11 feature completion audit
(commit 4174dbc3b, unmerged). Its scores are judgement calls drawn from `docs/KNOWN.md`, the plans and the code;
KNOWN wins on any disagreement. The audit was scored before Sprint 18 closed, so two of its rows are re-scored
here from KNOWN section 1's row "The launcher's PCSX2 client reaches our lobby from a clean home (2026-10-12)";
the category notes below say which. By the owner's ruling of 2026-10-12 the status map counts the recomp, the game
and our server only; the audit's other two categories, and its second headline figure that averages them, are
left out.
"""

# The function map: one cell per start. The same two inputs tools_py/fix_ghidra_csv.py merges before ps2_recomp runs.
[functions]
map = "recomp/socom2_ghidra.csv"
extra = "recomp/extra_functions.txt"

# Header badges: feature completion. The category scores are copied from the 2026-10-11 feature completion audit
# (commit 4174dbc3b on branch ccr-e287335b-k425ts, not merged; judgement calls, KNOWN
# wins over them); each [[feature]] badge is the plain mean of the categories it names, computed by the generator.
# Owner ruling 2026-10-12: nothing of the web part -- the audit's "Web companion" and "Project infrastructure"
# categories and its "around it" figure are not copied here (tools_py/tests/test_status_map.py holds that).
[[category]]
name = "Engine: CPU and system"
percent = 66

[[category]]
name = "Engine: graphics"
percent = 60

[[category]]
name = "Sound and voice"
percent = 45

[[category]]
name = "Input and storage"
percent = 75

[[category]]
name = "Game content"
percent = 71

[[category]]
name = "Online client"
percent = 53

[[category]]
name = "Platforms"
percent = 55

[[category]]
name = "Getting it to players"
percent = 41
note = "The audit's 33, re-scored: its row 'Launcher PCSX2 mode' 10 -> 50 (Functional: install, launch and our lobby proven from a clean home, KNOWN section 1, 2026-10-12; no round played through it yet). Rows 80, 50, 35, 15, 25."

[[category]]
name = "Server"
percent = 55
note = "The audit's 41, re-scored: its row 'DNS for PCSX2 players' 15 -> 70 (Playable: the box's socom-dns answered the game's lookup, KNOWN section 1, 2026-10-12). Rows 80, 60, 10, 70."

[[feature]]
label = "recomp + game"
categories = ["Engine: CPU and system", "Engine: graphics", "Sound and voice", "Input and storage", "Game content",
              "Online client", "Platforms", "Getting it to players"]
note = "Platforms is the native client's (Windows, Linux, macOS); Getting it to players is the launcher and the release."

[[feature]]
label = "server"
categories = ["Server"]
note = "Our Horizon server: hosting and operations, hardening, persistence, DNS for PCSX2 players."

# ---------------------------------------------------------------------------------------------------------------
# Panel 1: the libraries linked into the loader SCUS_972.75 (research/05: "only a loader ... main() at 0x1c4cc0").
# A range is [start, end): every function start in it is one cell; `short`, when given, is the label drawn on the
# map. Boundaries are the first named function of each library in recomp/socom2_names.csv (the stub selectors of
# recomp/socom2.toml name the same addresses).
# Left out on purpose: the loader's own code (0x1801c8-0x181b00 and from 0x1c1cd0: the "mp_net" BSD-socket shim
# of research/10, main()), which is the game's, and zlib 1.1.4, a third-party library. The game image's own Sony
# code (libnet's EE wrappers, lgAud, snd_*, sceInet*) is not in this panel at all (meta.intro says so in the table).
# ---------------------------------------------------------------------------------------------------------------

[[library]]
name = "crt0"
ranges = [[0x180008, 0x1801C8]]
status = "ok"
note = "The entry point; the restarted guest re-enters it in-process (KNOWN section 1, 'The online logoff restarts the game in-process': guest restarted at 0x180008, reaches the main menu)."

[[library]]
name = "C++ runtime (MW)"
short = "C++ RTS"
ranges = [[0x181B00, 0x182930]]
status = "ok"
note = "Metrowerks runtime: array new/delete, the overlay manager, dynamic_cast, member pointers. Runs on every boot; the overlays are pre-merged into socom2_game.elf (research/05). No KNOWN row of its own; the gate and the online rounds (KNOWN section 1) rest on it."

[[library]]
name = "C++ EH (MW)"
short = "C++ EH"
ranges = [[0x182930, 0x184660]]
status = "ok"
note = "Metrowerks exception unwinding, recompiled as is. No defect or divergence in KNOWN or LATER; no KNOWN row shows the game throwing either -- unverified, which by this map's rule is not partial."

[[library]]
name = "MSL C++ std"
ranges = [[0x184660, 0x18DBB8]]
status = "ok"
note = "Metrowerks Standard Library (iostreams, locale, ctype, codecvt, string), recompiled as is. No defect or divergence in KNOWN or LATER, and no KNOWN row exercises it -- unverified, which by this map's rule is not partial."

[[library]]
name = "libcdvd"
ranges = [[0x18DBB8, 0x18FCB8]]
status = "ok"
note = "HLE over your own disc image. KNOWN section 1: 'sceCdRead moved the CD stream cursor; fixed' (the title loop correlates 1.000 with the disc PCM) and the from-a-fresh-clone row (ISO to the title)."

[[library]]
name = "libdbc"
ranges = [[0x18FCB8, 0x190BC8]]
status = "ok"
note = "Kept idle on purpose: the pads come through the libpad2 HLE, which answers the calls that would reach DBCMAN (socom2_pad2_hle.cpp). The pad drives every gate and ladder run (KNOWN section 1)."

[[library]]
name = "libdma"
ranges = [[0x190BC8, 0x191440]]
status = "ok"
note = "Every frame's transfers reach the GS; the gate passes 3/3 on every chain (KNOWN section 1). Never compared with a console (LATER 13, 'no defect seen') -- unverified, which by this map's rule is not partial."

[[library]]
name = "libc (newlib)"
short = "libc"
ranges = [[0x191440, 0x19EB18]]
status = "partial"
note = "Recompiled newlib; KNOWN section 1: 'rand() returned 15 bits over a _rand_next frozen at 41' -- fixed (ede2096). Partial on issue #60 (open, LATER 14, docs/HAZARDS.md): the function-table slot of the fwrite stub at 0x194520 holds _fwalk, so a table dispatch there runs guest code, not the HLE."

[[library]]
name = "libgcc"
ranges = [[0x19EB18, 0x1A13D0]]
status = "ok"
note = "64-bit integer and soft-double helpers. KNOWN section 1: 'Five soft-double stubs were bound with the wrong ABI' -- fixed (db7a992)."

[[library]]
name = "libgraph"
ranges = [[0x1A13D0, 0x1A30B8]]
status = "partial"
note = "KNOWN section 2: 'sceGsSetDefDBuff reads its trailing args from the stack' -- fixed (07ffc0a). Partial on what that row still records: the consumed display environment (MAGH, DW, DY, PMODE) and zbp differ from the console's, believed to have no visible effect."

[[library]]
name = "libipu"
ranges = [[0x1A30B8, 0x1A3720]]
status = "ok"
note = "Served by the MPEG HLE with libmpeg. KNOWN section 1: 'The intro-movie macroblocks were a cross-thread race' -- fixed (4a701f1)."

[[library]]
name = "libkernel"
ranges = [[0x1A3720, 0x1A4B80], [0x1ABFD8, 0x1AD088]]
status = "ok"
note = "Syscalls, threads, semaphores, alarms, TLB, ExecPS2. KNOWN section 1: 'Equal-priority time slicing was an ours-only semantic; removed' and 'The online logoff restarts the game in-process' (LoadExecPS2)."

[[library]]
name = "deci2 / tty"
short = "deci2"
ranges = [[0x1A4B80, 0x1A5C98]]
status = "partial"
note = "libkernel's debug channel (Deci2, TTY, kprintf). A divergence read from the runtime's code (KNOWN and LATER are silent): the Deci2 calls are TODO stubs (Kernel/Stubs/Deci2.cpp), not a model."

[[library]]
name = "sif"
ranges = [[0x1A5C98, 0x1A7398]]
status = "partial"
note = "SIF commands and RPC, served by the runtime's IOP model; KNOWN section 1: 'sceSifInitRpc reset the whole IOP model on every call' -- fixed. Partial on issue #60 (open, LATER 14, docs/HAZARDS.md): the _sceSifCmdIntrHdlr slot at 0x1A6190 holds isceSifSendCmd."

[[library]]
name = "fileio"
ranges = [[0x1A7398, 0x1AAA78]]
status = "partial"
note = "Host and disc file I/O behind the IOP model; every boot reads through it (KNOWN section 1, the from-a-fresh-clone row). Partial on LATER 52: pfs0: (the HDD) is not served, so the three HDD maps (After Hours, Last Bastion, Liberation) cannot be played."

[[library]]
name = "iopheap / loadfile"
short = "loadfile"
ranges = [[0x1AAA78, 0x1ABFD8]]
status = "ok"
note = "IOP heap and module loading, answered by the runtime's per-revision IOP profile (KNOWN section 1, 'The launcher started socom2.exe whatever GAME VERSION said': a second IOP profile for r0004)."

[[library]]
name = "libm"
ranges = [[0x1AD088, 0x1B3970]]
status = "ok"
note = "fdlibm, recompiled. KNOWN section 2: 'sin/cos have no live call sites' (believed; matters only if their binding were wrong)."

[[library]]
name = "libmc"
ranges = [[0x1B3970, 0x1B5160]]
status = "ok"
note = "EE libmc HLE over a card folder. KNOWN section 1: 'An empty or missing card folder is an inserted, formatted, empty PS2 card', the first-save fix (152579a) and the persona file decoded."

[[library]]
name = "libmpeg"
ranges = [[0x1B5160, 0x1BCD80]]
status = "partial"
note = "FFmpeg-backed MPEG HLE; movies play on every gate. KNOWN section 1: the intro-movie macroblock race and the MPEG back-pressure gate behind the music dropouts, both fixed. Partial on docs/BACKLOG.md's audio-level-residuals row: the movie audio about 18 dB low at the source. A freeze seen once in Sprint 1 stays a section 2 belief."

[[library]]
name = "libmrpc"
ranges = [[0x1BCD80, 0x1BD588]]
status = "ok"
note = "msifrpc, the network library's transport (research/10), HLE'd. KNOWN section 1: 'An online round plays end to end on the project's HOSTED Horizon server'."

[[library]]
name = "libpad2"
ranges = [[0x1BD588, 0x1BDE40]]
status = "partial"
note = "HLE of the first port. Pressure is all or nothing (0xFF), so crouch needs the launcher's shortcut (KNOWN section 1, 'Crouch was unreachable on any PC pad, and now has a shortcut (R139)'); issue #105 open: the pad is read while no window has focus."

[[library]]
name = "libscf"
ranges = [[0x1BDE40, 0x1BE530]]
status = "partial"
note = "System configuration (language, aspect, time zone, RTC). A divergence read from the config (KNOWN and LATER are silent): stub selectors in recomp/socom2.toml stand in for the console's settings; the game runs in English at its defaults."

[[library]]
name = "libvib"
ranges = [[0x1BE530, 0x1BE6A0]]
status = "pending"
note = "No rumble: the pad HLE reports no actuators, so the game sends no vibration (socom2_pad2_hle.cpp). No KNOWN row."

[[library]]
name = "libusbkb"
ranges = [[0x1BE6A0, 0x1BFC30]]
status = "pending"
note = "No PS2 USB keyboard model: the host keyboard reaches the game as pad input and the on-screen keyboard (docs/HAZARDS.md, 'The harness plays the game with the keyboard'). No KNOWN row."

[[library]]
name = "libvu0"
ranges = [[0x1BFC30, 0x1C0948]]
status = "partial"
note = "Recompiled since libvu0 was un-stubbed; KNOWN section 1: 'The VU0 vf0 fix restores Frostfire online control'. Partial on a known divergence: LATER 12, issue #47 open (macro-mode MAC/STATUS flags land at once, not with the hardware's latency); the FTOI NaN rule is the fork's (KNOWN section 2)."

[[library]]
name = "libinsck + netglue"
short = "insck"
ranges = [[0x1C0948, 0x1C1CD0]]
status = "ok"
note = "The socket layer under the game's network code. Anchored by the named sceInsockInetAddr (0x1c1348) and sceEENetInetNtoa (0x1c1858); the start 0x1c0948 is inferred (the unnamed functions after libvu0's last, whose sizes match netglue_insck's in ps2recomp's symbol database, third_party/ps2recomp/ps2xAnalyzer/include/ps2recomp/sce_symbol_database_data.h). KNOWN section 1: the hosted online round and 'The online movement blocker was sceInetInterfaceControl(0x200) returning a constant' (fixed)."

# ---------------------------------------------------------------------------------------------------------------
# Panel 2: the PS2's hardware, weighted. `short` is drawn on the map; `name` and `note` are in the table and the
# tooltip. The IOP is modelled at the RPC level (HLE), not emulated: there is no R3000A here on purpose.
# Weights: a rough share of the work each component asks of a recompilation and its runtime (judgement calls, as in
# the map this follows): the CPU 5; kernel, GS, VIF1/VU1 and SPU2 3; most others 2; the timers, USB and HDD 1.
# ---------------------------------------------------------------------------------------------------------------

[[hardware]]
group = "EE"

  [[hardware.component]]
  short = "R5900"
  name = "R5900 CPU, recompiled to C++"
  status = "partial"
  weight = 5
  note = "Every map row recompiles; the gate passes 3/3 on every chain, r0004 too (KNOWN section 1, 'The r0004 build passes the gate 3/3'). Partial on three open recompiler defects: #60 (a stub's table slot holds another owner's resume entry, LATER 14), #54 (1090 nested forced-entry rows in the map) and #55 (map bounds lose to the JAL-target carvings)."

  [[hardware.component]]
  short = "Kernel"
  name = "Kernel: threads, semaphores, alarms, ExecPS2"
  status = "ok"
  weight = 3
  note = "KNOWN section 1: the priority scheduler ('Equal-priority time slicing ... removed') and the in-process LoadExecPS2 restart."

  [[hardware.component]]
  short = "FPU/MMI"
  name = "FPU (COP1) and MMI instructions"
  status = "partial"
  weight = 2
  note = "A known divergence: LATER 11, the FPU translator is plain IEEE with no PS2 clamping (no defect seen from it yet). KNOWN section 2: numeric parity of the generated MMI/VU0 code under NEON (the macOS port) is unproven."

  [[hardware.component]]
  short = "INTC"
  name = "INTC: VBlank and GS interrupts"
  status = "ok"
  weight = 2
  note = "VBlank holds near the console's 16.7 ms; two instances keep the guest clock at real time (KNOWN section 1, 'Two instances hold the guest clock at real time')."

  [[hardware.component]]
  short = "DMAC"
  name = "DMA controller"
  status = "ok"
  weight = 2
  note = "Runs every frame of every gate; never compared with a console (LATER 13, 'no defect seen') -- unverified, which by this map's rule is not partial."

  [[hardware.component]]
  short = "Timers"
  name = "EE timers"
  status = "ok"
  weight = 1
  note = "LATER 10: no console timing oracle, interrupt unit tests only, and no defect of the timers themselves (the frame-rate thread it names is counted under VIF1/VU1, where KNOWN places it; the drag freeze is fixed) -- unverified, which by this map's rule is not partial."

[[hardware]]
group = "GS / VU"

  [[hardware.component]]
  short = "GS"
  name = "GS: primitives and framebuffer (OpenGL)"
  status = "partial"
  weight = 3
  note = "Draws every screen, up to 4x resolution. KNOWN section 2: 'The main thread's GL replay stalls for good after a present' (intermittent, #114); open: #96 (a shadow read-back empties the gpuRows window) and #104 (Frostfire's depth band); LATER 55: no deinterlace, so the 480i output is not field-blended as PCSX2's is."

  [[hardware.component]]
  short = "VIF1/VU1"
  name = "VIF1 and VU1"
  status = "partial"
  weight = 3
  note = "Correct on the gate; the cost is the open thread. KNOWN section 2: 'The game thread's own work is what limits the mission's frame rate' (VU1 about 42 %); issue #59, the mission frame rate has no bar yet."

  [[hardware.component]]
  short = "Tex/CLUT"
  name = "GS textures and CLUTs"
  status = "partial"
  weight = 2
  note = "KNOWN section 1: the CLUT texture-cache explosion fixed (2026-09-16). Partial on LATER 54, a known divergence: no mipmap sampling (MIPTBP1/2, MXL, LCM and K stored, never read); and issue #32 open, textures re-decoded far more often than they change (KNOWN section 2)."

  [[hardware.component]]
  short = "GIF"
  name = "GIF (PATH1-3)"
  status = "ok"
  weight = 2
  note = "Runs every frame of every gate; never compared with a console (LATER 13, 'no defect seen') -- unverified, which by this map's rule is not partial."

  [[hardware.component]]
  short = "VU0"
  name = "VU0 (macro and micro mode)"
  status = "partial"
  weight = 2
  note = "KNOWN section 1: 'The VU0 vf0 fix restores Frostfire online control'. Partial on a known divergence: LATER 12, issue #47 open (macro-mode flags land at once, without the hardware's latency); the FTOI NaN rule is the fork's, not hardware-verified (KNOWN section 2)."

  [[hardware.component]]
  short = "IPU"
  name = "IPU: the movies"
  status = "ok"
  weight = 2
  note = "Through the FFmpeg MPEG HLE; KNOWN section 1, the intro-movie macroblock race fixed."

[[hardware]]
group = "IOP (HLE)"

  [[hardware.component]]
  short = "SPU2"
  name = "SPU2 and the 989snd driver (HLE)"
  status = "partial"
  weight = 3
  note = "Music sample-exact (KNOWN section 1, 'Missions are meant to have music'); the lobby track that played once and stopped now loops (fixed 567b127c, ff270d65; 188.5 s proven 2026-10-04). Partial on open issues: #91 the mission's ambient bed 7-10 dB under the console; #94 the login screens' dips; #42 about 50 ms of mission music lost between render() and the device (KNOWN section 2, nine holes on the merged tree; LATER 88); #28 the music degrades with time in a mission."

  [[hardware.component]]
  short = "SIF"
  name = "SIF DMA and RPC"
  status = "partial"
  weight = 2
  note = "KNOWN section 1: 'sceSifInitRpc reset the whole IOP model on every call' -- fixed. Partial on issue #60 (open, LATER 14): the _sceSifCmdIntrHdlr slot at 0x1A6190 holds isceSifSendCmd, so a table dispatch there runs guest code."

  [[hardware.component]]
  short = "CDVD"
  name = "CD/DVD drive (your own disc image)"
  status = "ok"
  weight = 2
  note = "KNOWN section 1: the from-a-fresh-clone row and the sceCdRead stream-cursor fix."

  [[hardware.component]]
  short = "MC"
  name = "Memory cards"
  status = "ok"
  weight = 2
  note = "KNOWN section 1: an empty folder is a formatted card; the persona file is decoded; the launcher's persona is one the game reads. (The launcher's multi-persona writer has an open issue of its own; it is the launcher's, not the card model's.)"

  [[hardware.component]]
  short = "Network"
  name = "Network adapter (DEV9) and the IOP stack"
  status = "partial"
  weight = 2
  note = "KNOWN section 1: 'An online round plays end to end on the project's HOSTED Horizon server'. Partial on issue #34 (open: the online-freeze candidate, a paused console peer) and LATER 102 (POSIX builds: a peer's reset can kill the game with SIGPIPE). KNOWN section 2: no round yet between two different networks."

