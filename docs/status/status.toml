  short = "HDD"
  name = "HDD (pfs0:): the three HDD maps"
  status = "pending"
  weight = 1
  note = "Not modelled: LATER 52, pfs0: is not served, so After Hours, Last Bastion and Liberation cannot be played (research/77 has the mechanism and an order). Weight 1: the game uses it for three online maps only."
